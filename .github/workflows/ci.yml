name: PR-Whisperer CI/CD & Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Linting, Deterministic Guardrails & Pytest Matrix
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Code Style & Quality Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ tests/ incident-response/ mcp-server/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treat all other flake8 warnings as informational
          flake8 backend/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Pytest Unit & Integration Tests with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=80 -v

      - name: Verify MCP Server Stdio Protocol & CLI
        run: |
          python mcp-server/server.py --test-list
          python mcp-server/server.py --test-fix PR-101

  # ----------------------------------------------------------------------------
  # 2. Frontend Build & Static Asset Compilation
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker Compose Stack Validation
  # ----------------------------------------------------------------------------
  docker-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # ----------------------------------------------------------------------------
  # 4. Dev-to-Prod Deployment & Promotion Gate
  # ----------------------------------------------------------------------------
  dev-prod-promotion:
    name: Dev-to-Prod Deployment Gate
    needs: [backend-test, frontend-build, docker-validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secret Scrubbing & Cleanliness Gate
        run: |
          echo "Verifying zero sensitive API credentials in git repository..."
          ! grep -rn "sk_live_[0-9a-zA-Z]\{24\}" backend/ frontend/ || (echo "FAILED: Live Stripe credential pattern found!" && exit 1)
          echo "Secret scrubbing verification gate passed cleanly."

      - name: Promotion Checkpoint
        run: |
          echo "PR-Whisperer CI/CD Pipeline passed all verification gates."
          echo "Production deployment image ready for container registry tag: pr-whisperer:${{ github.sha }}"
