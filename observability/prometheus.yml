global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yaml"

scrape_configs:
  - job_name: "pr-whisperer-backend"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "pr-whisperer-backend"
          tier: "voice-ai-engine"
          env: "production"
