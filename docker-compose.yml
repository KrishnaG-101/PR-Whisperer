services:
  # 1. PostgreSQL 16 Relational Persistence
  db:
    image: postgres:16-alpine
    container_name: pr-whisperer-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_whisperer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_whisperer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whisperer-net

  # 2. FastAPI Intelligence & Deterministic Guardrails Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pr-whisperer-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/pr_whisperer
      ENVIRONMENT: production
      INCIDENT_MODE: "0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - whisperer-net

  # 3. React 18 + Vite + Tailwind CSS Review Studio Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr-whisperer-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - whisperer-net

  # 4. Prometheus Real-time Observability Metric Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: pr-whisperer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
    networks:
      - whisperer-net

volumes:
  postgres_data:
    driver: local

networks:
  whisperer-net:
    driver: bridge
